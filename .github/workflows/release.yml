name: release

# Publishes the container image when a version tag (vX.Y.Z, or a pre-release like vX.Y.Z-beta.N) is pushed:
# ghcr.io/<owner>/hqpweb:<version> and :latest, for amd64 and arm64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 2026-10-19. Move up on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hqpweb
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=hqpweb
            org.opencontainers.image.description=A web controller for HQPlayer
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checkout's .git (HEAD and refs only, per .dockerignore) names the commit.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hqpweb
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
