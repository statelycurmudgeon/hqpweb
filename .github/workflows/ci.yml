name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 2026-10-19. Move up on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lint/package-lock.json
      - run: npm ci
      # ESLint has its own install (TypeScript 6.0; see lint/eslint.config.js).
      - run: npm ci --prefix lint
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lines
      - run: npm run typecheck
      - run: npm run check -w apps/web
      - run: npm run check -w apps/mobile
      - run: npm test
      - run: npm run build -w apps/web

  # Browser smoke tests against fake HQPlayers. The screenshots are an artifact to look at.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots/
            e2e/report/
            e2e/test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t hqpweb:ci .
      - name: Start it and check health
        run: |
          docker run -d --name wc -p 4380:4380 hqpweb:ci
          want="$(git rev-parse HEAD | cut -c1-7)"
          for i in $(seq 1 30); do
            if h="$(curl -fsS http://127.0.0.1:4380/api/health)"; then
              echo "$h"
              # The image names the commit it was built from.
              echo "$h" | grep -q "\"commit\":\"$want\"" && exit 0
              echo "expected commit $want"; exit 1
            fi
            sleep 1
          done
          docker logs wc
          exit 1
